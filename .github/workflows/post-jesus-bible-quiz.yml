name: Post Jesus Bible Quiz Short

# EVENING Bible Quiz Short for Jesus Worship Waves: asks about the SAME verse the morning Quote
# Short posted (post-jesus-worship-waves.yml). Own state file (jesus_quiz_state.json), own
# playlist; shares the Jesus YouTube token. Needs approved BGM clips -- see
# channels/jesus/scripts/post.py. Original header of the morning workflow follows.
#
# Part of the 7-channel expansion (channels/, added 2026-10) -- Pattern A (static content
# bank), same shared-engine design as channels/engine/. Same cron-job.org + daily-reschedule
# pattern as post-ramana-short.yml: a cron-job.org watchdog calls this workflow's
# workflow_dispatch endpoint repeatedly through a window, channels/jesus/scripts/ci/gate.py
# decides on each call whether THIS is the day's randomly-chosen post time (18:00-18:40 IST,
# see that file), and scripts/ci/cronjob_reschedule.py re-points cron-job.org to fire only at
# [target, 07:55 safety-net] each day instead of ticking every few minutes through the whole
# window -- see that script's "jesus" SERIES entry.
#
# Posts UNLISTED by default (--public is NOT passed) until reviewed.
#
# *** DRIVE SETUP REQUIRED BEFORE THE FIRST GATED RUN *** -- see
# scripts/ci/drive_state_sync.py's module docstring: create two files by hand in the same
# Drive folder as every other marker file -- an empty one named exactly
# "youtube_token_jesus.json", and one named exactly "jesus_state.json" containing just `{}`.
#
# *** ONE-TIME LOCAL STEPS BEFORE THE FIRST REAL RUN ***
# 1. python -m mahanavi.scripts.youtube_shorts_auth_setup --token-file data/youtube_token_jesus.json
#    (choose the Jesus Worship Waves channel/account at the Google consent screen)
# 2. python scripts/ci/drive_state_sync.py push
# 3. Create a cron-job.org job whose URL is
#    https://api.github.com/repos/OWNER/REPO/actions/workflows/post-jesus-bible-quiz.yml/dispatches
#    (method POST, body {"ref":"main"}, same auth headers as this repo's other cron-job.org jobs)
#    -- any starting schedule is fine, reschedule-cronjobs.yml takes it over from the first run.
on:
  workflow_dispatch:
    inputs:
      public:
        description: "Upload as public. Uncheck for an unlisted test/review run."
        required: false
        type: boolean
        default: false
      bypass_gate:
        description: >-
          Post immediately, ignoring the 18:00-18:40 IST window and today's already-posted
          marker. For manual testing/review runs only.
        required: false
        type: boolean
        default: false
      force_row:
        description: "Force a specific content row id instead of the normal rotation. Leave blank for normal behavior."
        required: false
        default: ''
  schedule:
    - cron: "30 12 * * *"  # 18:00 IST
    - cron: "25 14 * * *"  # 19:55 IST, late safety net

concurrency:
  group: post-jesus-bible-quiz
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  post-jesus-bible-quiz:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install minimal deps for state sync + gate
        run: pip install google-auth google-api-python-client

      - name: Restore persistent state from Google Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py pull

      - name: Decide whether this call should post today
        id: gate
        env:
          STATE_FILE: data/jesus_quiz_state.json
          FORCE_POST: ${{ inputs.bypass_gate && 'true' || 'false' }}
        run: python -m channels.jesus.scripts.ci.gate_quiz

      - name: Install ffmpeg + Telugu text shaping libs
        if: steps.gate.outputs.post == 'true'
        run: |
          bash scripts/ci/apt_install.sh ffmpeg libraqm0 libfribidi0 libharfbuzz0b

      - name: Install full Python dependencies
        if: steps.gate.outputs.post == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Jesus Bible Quiz pipeline
        id: pipeline
        if: steps.gate.outputs.post == 'true'
        env:
          STATE_FILE: data/jesus_quiz_state.json
          MAHANAVI_JESUS_YOUTUBE_TOKEN_FILE: ./data/youtube_token_jesus.json
          MAHANAVI_JESUS_QUIZ_PLAYLIST_ID: ${{ secrets.MAHANAVI_JESUS_QUIZ_PLAYLIST_ID }}
          MAHANAVI_JESUS_BLOGGER_BLOG_ID: ${{ secrets.MAHANAVI_JESUS_BLOGGER_BLOG_ID }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: |
          ARGS=""
          if [ "${{ inputs.public }}" = "true" ]; then
            ARGS="$ARGS --public"
          fi
          if [ -n "${{ inputs.force_row }}" ]; then
            ARGS="$ARGS --row ${{ inputs.force_row }}"
          fi
          python3 -m channels.jesus.scripts.post_quiz $ARGS

      - name: Push state to Drive (includes advanced rotation + any refreshed token)
        if: always() && steps.gate.outputs.post == 'true'
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py push

      - name: Upload run output as artifact (debugging)
        if: steps.gate.outputs.post == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: jesus-bible-quiz-run-${{ github.run_id }}
          path: |
            out/short.mp4
            out/meta.json
            out/captions_*.srt
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/ci/notify_failure.py "Post Jesus Bible Quiz Short"
