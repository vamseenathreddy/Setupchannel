name: Update Navaratri Song SEO (One-Time)

# One-off manual step: pushes the current navaratri_song_seo.py content
# (title/description/tags) onto the most recent "Swarnakavachadharini
# Kanakadurgamma" private draft via videos().update(). The SEO copy was
# improved (Telugu-script tags, Navaratri playlist link) AFTER the video
# had already been uploaded, so the live video's metadata needs a
# separate push rather than just being baked in at upload time.
#
# Output (including any failure) is pushed to Drive
# (navaratri_seo_update_log.txt) since this environment can't fetch
# GitHub Actions job logs directly.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  update-seo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install minimal deps for state sync
        run: pip install google-auth google-api-python-client

      - name: Restore persistent state from Google Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py pull

      - name: Install full Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Update SEO
        env:
          MAHANAVI_YOUTUBE_TOKEN_FILE: ./data/youtube_token.json
        run: |
          set -o pipefail
          python scripts/ci/update_navaratri_seo.py 2>&1 | tee data/navaratri_seo_update_log.txt

      - name: Push result log to Drive
        if: always()
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/push_drive_asset.py data/navaratri_seo_update_log.txt navaratri_seo_update_log.txt
