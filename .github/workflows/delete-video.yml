name: Delete Video (One-Off Utility)
on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "YouTube video id to delete"
        required: true
      expected_title:
        description: "Title must contain this text (safety check)"
        required: false
        default: ""
      token_file:
        description: "Saved token of the channel that owns the video (default youtube_token.json)"
        required: false
        default: "youtube_token.json"
permissions:
  contents: read
jobs:
  delete:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - run: pip install google-auth google-api-python-client
      - name: Restore state from Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py pull
      - name: Install full Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Delete
        env:
          MAHANAVI_YOUTUBE_TOKEN_FILE: ./data/${{ inputs.token_file || 'youtube_token.json' }}
        run: python3 scripts/ci/delete_video.py "${{ inputs.video_id }}" "${{ inputs.expected_title }}"
