name: Tollywood News | Short (1 PM IST)

# Part of the 7-channel expansion (channels/, added 2026-10) -- Pattern B (one real, trending
# Telugu-film-industry headline fetched from Google News RSS each run, no static content bank
# -- see channels/engine/trending.py and channels/tollywood_news/metadata_config.py). Same
# minimal-usage design as Pulse Boosting. Same cron-job.org + daily-reschedule pattern:
# channels/tollywood_news/scripts/ci/gate.py decides on each call whether THIS is the day's
# randomly-chosen post time (13:00-13:40 IST), and scripts/ci/cronjob_reschedule.py re-points
# cron-job.org to fire only at [target, 15:25 safety-net] each day -- see that script's
# "tollywood_news" SERIES entry.
#
# A day where nothing fresh published in the last 6 hours is a CLEAN SKIP (exit 0, nothing
# posted) -- not a failure. See channels/engine/post.py's run().
#
# Posts UNLISTED by default (--public is NOT passed) until reviewed.
#
# *** DRIVE SETUP REQUIRED BEFORE THE FIRST GATED RUN *** -- create two files by hand in the
# same Drive folder as every other marker file -- an empty one named exactly
# "youtube_token_tollywood_news.json", and one named exactly "tollywood_news_state.json"
# containing just `{}`.
#
# *** ONE-TIME LOCAL STEPS BEFORE THE FIRST REAL RUN ***
# 1. python -m mahanavi.scripts.youtube_shorts_auth_setup --token-file data/youtube_token_tollywood_news.json
#    (choose the Tollywood News channel/account at the Google consent screen)
# 2. python scripts/ci/drive_state_sync.py push
# 3. Create a cron-job.org job whose URL is
#    https://api.github.com/repos/OWNER/REPO/actions/workflows/post-tollywood-news.yml/dispatches
#    (method POST, body {"ref":"main"}) -- any starting schedule is fine.
on:
  workflow_dispatch:
    inputs:
      public:
        description: "Upload as public. Uncheck for an unlisted test/review run."
        required: false
        type: boolean
        default: false
      bypass_gate:
        description: >-
          Post immediately, ignoring the 13:00-13:40 IST window and today's already-posted
          marker. For manual testing/review runs only.
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "30 7 * * *"  # 13:00 IST
    - cron: "0 8 * * *"  # extra ping (gate posts on the first one past the target minute)
    - cron: "30 8 * * *"  # extra ping (gate posts on the first one past the target minute)
    - cron: "0 9 * * *"  # extra ping (gate posts on the first one past the target minute)
    - cron: "30 9 * * *"  # extra ping (gate posts on the first one past the target minute)
    - cron: "55 9 * * *"  # 15:25 IST, late safety net

concurrency:
  group: post-tollywood-news
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  post-tollywood-news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install minimal deps for state sync + gate
        run: pip install google-auth google-api-python-client

      - name: Restore persistent state from Google Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py pull

      - name: Decide whether this call should post today
        id: gate
        env:
          STATE_FILE: data/tollywood_news_state.json
          FORCE_POST: ${{ inputs.bypass_gate && 'true' || 'false' }}
        run: python -m channels.tollywood_news.scripts.ci.gate

      - name: Install ffmpeg + text shaping libs
        if: steps.gate.outputs.post == 'true'
        run: |
          bash scripts/ci/apt_install.sh ffmpeg libraqm0 libfribidi0 libharfbuzz0b

      - name: Install full Python dependencies
        if: steps.gate.outputs.post == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Tollywood News pipeline
        id: pipeline
        if: steps.gate.outputs.post == 'true'
        env:
          STATE_FILE: data/tollywood_news_state.json
          MAHANAVI_TOLLYWOOD_NEWS_YOUTUBE_TOKEN_FILE: ./data/youtube_token_tollywood_news.json
          MAHANAVI_TOLLYWOOD_NEWS_BLOGGER_BLOG_ID: ${{ secrets.MAHANAVI_TOLLYWOOD_NEWS_BLOGGER_BLOG_ID }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: |
          ARGS=""
          if [ "${{ inputs.public }}" = "true" ]; then
            ARGS="$ARGS --public"
          fi
          python3 -m channels.tollywood_news.scripts.post $ARGS

      - name: Push state to Drive (includes any refreshed token)
        if: always() && steps.gate.outputs.post == 'true'
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py push

      - name: Upload run output as artifact (debugging)
        if: steps.gate.outputs.post == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tollywood-news-run-${{ github.run_id }}
          path: |
            out/short.mp4
            out/meta.json
            out/captions_*.srt
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/ci/notify_failure.py "Tollywood News | Short (1 PM IST)"
