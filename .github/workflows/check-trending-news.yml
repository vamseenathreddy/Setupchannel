name: Tools | Check Pulse Boosting news pools

# Read-only: shows how many latest-news stories each topic finds right now. Posts nothing.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - run: PYTHONPATH=src:. python scripts/ci/check_trending_news.py
