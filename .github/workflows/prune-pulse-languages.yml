name: Tools | Prune Pulse Boosting non-Telugu Shorts

# One-off clean-up after the channel became Telugu-only. Default run only LISTS what would be deleted; tick "apply" to delete.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Delete the non-Telugu Shorts. Leave off to only list them."
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - run: pip install google-auth google-api-python-client
      - name: Restore state from Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py pull
      - name: Install full Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: List or delete
        run: |
          ARGS=""
          if [ "${{ inputs.apply }}" == "true" ]; then ARGS="--apply"; fi
          PYTHONPATH=src:. python scripts/ci/prune_pulse_languages.py $ARGS
      - name: Push state to Drive (refreshed tokens)
        if: always()
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py push
