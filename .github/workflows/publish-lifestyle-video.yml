name: Weekly | Publish Lifestyle Videos (public + playlist + comment)

# Makes reviewed lifestyle videos public, adds each to its channel playlist and posts the seed comment.
# Leave an id blank to skip that channel.
on:
  workflow_dispatch:
    inputs:
      te_id:
        description: "Mahanavi Spirituals (Telugu) video id"
        required: false
        default: ''
      hi_id:
        description: "Divine Mantra Sangam (Hindi) video id"
        required: false
        default: ''
      tb_id:
        description: "Devotional Trance Beats (Hindi) video id"
        required: false
        default: ''

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install minimal deps for state sync
        run: pip install google-auth google-api-python-client
      - name: Restore persistent state from Google Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py pull
      - name: Install full Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Publish
        env:
          MAHANAVI_TIMEZONE: Asia/Kolkata
          MAHANAVI_DATABASE_PATH: ./data/mahanavi.db
          MAHANAVI_LOG_DIR: ./data/logs
          TE_ID: ${{ inputs.te_id }}
          HI_ID: ${{ inputs.hi_id }}
          TB_ID: ${{ inputs.tb_id }}
        run: |
          rc=0
          for pair in "te:$TE_ID" "hi:$HI_ID" "tb:$TB_ID"; do
            L="${pair%%:*}"; ID="${pair#*:}"
            if [ -n "$ID" ]; then PYTHONPATH=src:. python3 -m channels.lifestyle.publish --lang "$L" --video-id "$ID" || rc=1; fi
          done
          exit $rc
      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/ci/notify_failure.py "Weekly | Publish Lifestyle Videos"
