name: Channel A | Navaratri Day 2 Song (one-time)

# One-off manual pipeline for the Dasara Navaratri Day 2 devotional SONG
# video ("Sri Bala Tripurasundari Devi") -- see
# post_navaratri_day2_song.py's module docstring for the full design.
# Unlike the Day 1 workflow, this does NOT need MAHANAVI_FAL_API_KEY --
# visuals are channel-owner-supplied stills already committed to this
# repo under assets/images/navaratri_day2/, animated locally with
# ffmpeg's Ken Burns zoompan filter.
#
# Needs ONE thing in place before a dispatch will succeed: the song WAV
# uploaded by hand into the same synced Drive folder used for all other
# persistent state, saved as exactly
# "navaratri_balatripurasundari_song_02.wav" (see
# post_navaratri_day2_song.py's SONG_FILENAME).
#
# Uploads as UNLISTED (not public, not private) -- viewable via direct
# link for review, but not searchable/public until the channel owner
# publishes it manually from YouTube Studio.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  post-navaratri-day2-song:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install minimal deps for state sync
        run: pip install google-auth google-api-python-client

      - name: Restore persistent state from Google Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py pull

      - name: Fetch song WAV from Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/fetch_drive_asset.py navaratri_balatripurasundari_song_02.wav

      - name: Install ffmpeg
        run: bash scripts/ci/apt_install.sh ffmpeg

      - name: Install full Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Assemble (Ken Burns on committed images) and upload as unlisted
        env:
          MAHANAVI_YOUTUBE_TOKEN_FILE: ./data/youtube_token.json
          MAHANAVI_PLAYLIST_ID_NAVARATRI_SONGS: ${{ secrets.MAHANAVI_PLAYLIST_ID_NAVARATRI_SONGS }}
        run: |
          set -o pipefail
          python3 -m mahanavi.scripts.post_navaratri_day2_song 2>&1 | tee data/navaratri_day2_song_error.log

      # Diagnostic hand-off (same pattern as Day 1 -- this environment
      # can't fetch GitHub Actions job logs directly, blocked egress to
      # the blob storage they redirect to). Destination file must
      # already exist in Drive (service-account create() has no quota).
      - name: Push error log to Drive (on failure)
        if: failure()
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/push_drive_asset.py data/navaratri_day2_song_error.log navaratri_day2_song_error.log

      - name: Upload generated video as a run artifact (for review before it's live)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: navaratri-day2-song-video-${{ github.run_id }}
          path: data/generated/navaratri_balatripurasundari_song_02.mp4
          if-no-files-found: ignore
          retention-days: 30

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/ci/notify_failure.py "Channel A | Navaratri Day 2 Song (one-time)"
