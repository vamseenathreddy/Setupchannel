name: Daily Shorts Post

on:
  schedule:
    # Ticks EVERY HOUR, all day. A cheap gate step (scripts/ci/
    # scheduler_gate.py) decides on each tick whether to actually do
    # anything -- see that script's docstring for the full reasoning.
    # In short: GitHub's schedule: event is best-effort and has
    # confirmedly failed to fire at all on several real nights when
    # this was a single once-a-night cron. Hourly ticks give many
    # independent chances, and each Short's own "posted today" marker
    # (synced from Drive) means a dropped tick just gets retried on
    # the next one instead of silently losing the whole night.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force_target:
        description: >-
          Force-post ignoring the time-of-day window and today's
          marker: rahu_kalam, shubha_ghadiyalu, or both. Leave blank
          for normal tick behavior (only posts if it's 12:00-2:00 AM
          IST and today's post is still missing).
        required: false
        default: ''

# Serializes runs so an hourly tick can never execute the pipeline in
# parallel with one still in progress (a run can take a while) -- it
# waits until the one in front of it finishes and has pushed state,
# then sees that state before deciding what to do.
concurrency:
  group: daily-shorts-post
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  post-shorts:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      # Just enough to pull state from Drive and run the gate -- kept
      # separate from the full requirements.txt install below so the
      # ~22/24 hourly ticks that don't need to do anything stay fast
      # and cheap.
      - name: Install minimal deps for state sync + gate
        run: pip install google-auth google-api-python-client

      - name: Restore persistent state from Google Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py pull

      - name: Decide whether this tick should post, and which Short
        id: gate
        env:
          FORCE_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.force_target || '' }}
        run: python scripts/ci/scheduler_gate.py

      - name: Install ffmpeg
        if: steps.gate.outputs.target != 'none'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install full Python dependencies
        if: steps.gate.outputs.target != 'none'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Shorts pipeline
        if: steps.gate.outputs.target == 'rahu_kalam' || steps.gate.outputs.target == 'both'
        env:
          MAHANAVI_IMAGES_ROOT: ./Images
          MAHANAVI_ASSETS_DIR: ./assets
          MAHANAVI_OUTPUT_DIR: ./data/generated
          MAHANAVI_DATABASE_PATH: ./data/mahanavi.db
          MAHANAVI_LOG_DIR: ./data/logs
          MAHANAVI_TIMEZONE: Asia/Kolkata
          MAHANAVI_PANCHANG_PROVIDER: prokerala
          MAHANAVI_PROKERALA_CLIENT_ID: ${{ secrets.MAHANAVI_PROKERALA_CLIENT_ID }}
          MAHANAVI_PROKERALA_CLIENT_SECRET: ${{ secrets.MAHANAVI_PROKERALA_CLIENT_SECRET }}
          MAHANAVI_PROKERALA_CLIENT_ID_2: ${{ secrets.MAHANAVI_PROKERALA_CLIENT_ID_2 }}
          MAHANAVI_PROKERALA_CLIENT_SECRET_2: ${{ secrets.MAHANAVI_PROKERALA_CLIENT_SECRET_2 }}
          MAHANAVI_YOUTUBE_TOKEN_FILE: ./data/youtube_token.json
        run: python3 -m mahanavi.scripts.post_alert_shorts --public --only rahu_kalam

      - name: Mark Rahu Kalam done and push state to Drive
        if: steps.gate.outputs.target == 'rahu_kalam' || steps.gate.outputs.target == 'both'
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python scripts/ci/drive_state_sync.py mark-done rahu_kalam
          python scripts/ci/drive_state_sync.py push

      - name: Run Shorts pipeline (Shubha Ghadiyalu)
        if: steps.gate.outputs.target == 'shubha_ghadiyalu' || steps.gate.outputs.target == 'both'
        env:
          MAHANAVI_IMAGES_ROOT: ./Images
          MAHANAVI_ASSETS_DIR: ./assets
          MAHANAVI_OUTPUT_DIR: ./data/generated
          MAHANAVI_DATABASE_PATH: ./data/mahanavi.db
          MAHANAVI_LOG_DIR: ./data/logs
          MAHANAVI_TIMEZONE: Asia/Kolkata
          MAHANAVI_PANCHANG_PROVIDER: prokerala
          MAHANAVI_PROKERALA_CLIENT_ID: ${{ secrets.MAHANAVI_PROKERALA_CLIENT_ID }}
          MAHANAVI_PROKERALA_CLIENT_SECRET: ${{ secrets.MAHANAVI_PROKERALA_CLIENT_SECRET }}
          MAHANAVI_PROKERALA_CLIENT_ID_2: ${{ secrets.MAHANAVI_PROKERALA_CLIENT_ID_2 }}
          MAHANAVI_PROKERALA_CLIENT_SECRET_2: ${{ secrets.MAHANAVI_PROKERALA_CLIENT_SECRET_2 }}
          MAHANAVI_YOUTUBE_TOKEN_FILE: ./data/youtube_token.json
        run: python3 -m mahanavi.scripts.post_alert_shorts --public --only shubha_ghadiyalu

      - name: Mark Shubha Ghadiyalu done and push state to Drive
        if: steps.gate.outputs.target == 'shubha_ghadiyalu' || steps.gate.outputs.target == 'both'
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python scripts/ci/drive_state_sync.py mark-done shubha_ghadiyalu
          python scripts/ci/drive_state_sync.py push

      - name: Upload run output as artifact (debugging)
        if: steps.gate.outputs.target != 'none'
        uses: actions/upload-artifact@v4
        with:
          name: run-log-${{ github.run_id }}
          path: |
            data/logs/
            data/generated/
          if-no-files-found: ignore
          retention-days: 14
