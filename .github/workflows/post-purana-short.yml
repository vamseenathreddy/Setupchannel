name: Channel A | Purana Story Short (5 PM IST)

# Manual-trigger-only (no schedule: trigger -- GitHub's own scheduler
# has a confirmed, ongoing reliability bug, see daily-shorts.yml's
# history) -- driven externally by a cron-job.org watchdog that calls
# this workflow's workflow_dispatch endpoint repeatedly through the
# 5:00-6:00 PM IST window (e.g. every 5 minutes), same pattern as the
# night alert Shorts' watchdog. scripts/ci/purana_short_gate.py decides
# on each call whether THIS is the day's randomly-chosen post time (see
# that script's docstring) -- so although the trigger itself fires on a
# fixed schedule, the actual post time varies day to day, per explicit
# request ("rotating time line between 5 to 6 pm... not fixed time").
#
# Posts PUBLIC by default (per explicit request, 2026-10-02: "post this
# in daily basis in public directly") -- unlike every other series in
# this repo, which defaults to unlisted-for-review. Uncheck `public`
# for a one-off unlisted test/review run from the Actions UI.
on:
  workflow_dispatch:
    inputs:
      public:
        description: "Upload as public. Uncheck for an unlisted test/review run."
        required: false
        type: boolean
        default: true
      bypass_gate:
        description: >-
          Post immediately, ignoring the 5-6 PM time window and today's
          already-posted marker. For manual testing/review runs only --
          never set this on the recurring cron-job.org calls, or it
          will post on every single call instead of once a day.
        required: false
        type: boolean
        default: false
      force_story:
        description: >-
          Force a specific story instead of the next one in rotation --
          an index (0-9), or a title like "Gajendra". Leave blank for
          normal rotation behavior. A forced run does NOT advance the
          stored rotation state (it's a one-off re-post/test).
        required: false
        default: ''

# Serializes runs so two near-simultaneous cron-job.org calls can never
# execute the pipeline in parallel -- same reasoning as daily-shorts.yml.
concurrency:
  group: post-purana-short
  cancel-in-progress: false

permissions:
  contents: read

env:
  CHANNEL_BRANDS: ${{ secrets.CHANNEL_BRANDS }}

jobs:
  post-purana-short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install minimal deps for state sync + gate
        run: pip install google-auth google-api-python-client

      - name: Restore persistent state from Google Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py pull

      - name: Decide whether this call should post today
        id: gate
        env:
          BYPASS_GATE: ${{ inputs.bypass_gate && 'true' || 'false' }}
        run: python scripts/ci/purana_short_gate.py

      - name: Install ffmpeg
        if: steps.gate.outputs.target == 'post'
        run: bash scripts/ci/apt_install.sh ffmpeg

      - name: Install full Python dependencies
        if: steps.gate.outputs.target == 'post'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Purana Story Short pipeline
        if: steps.gate.outputs.target == 'post'
        env:
          MAHANAVI_IMAGES_ROOT: ./Images
          MAHANAVI_ASSETS_DIR: ./assets
          MAHANAVI_OUTPUT_DIR: ./data/generated
          MAHANAVI_DATABASE_PATH: ./data/mahanavi.db
          MAHANAVI_LOG_DIR: ./data/logs
          MAHANAVI_TIMEZONE: Asia/Kolkata
          MAHANAVI_YOUTUBE_TOKEN_FILE: ./data/youtube_token.json
          MAHANAVI_PLAYLIST_ID_PURANAS: ${{ secrets.MAHANAVI_PLAYLIST_ID_PURANAS }}
          MAHANAVI_BLOGGER_BLOG_ID: ${{ secrets.MAHANAVI_BLOGGER_BLOG_ID }}
        run: |
          ARGS=""
          if [ "${{ inputs.public }}" = "true" ]; then
            ARGS="$ARGS --public"
          fi
          if [ -n "${{ inputs.force_story }}" ]; then
            ARGS="$ARGS --story ${{ inputs.force_story }}"
          fi
          python3 -m ytcore.scripts.post_purana_short $ARGS

      # Marks today's post done -- deliberately NO `if: always()` here:
      # this step only runs if the pipeline step above actually
      # succeeded (GitHub Actions' default behavior skips subsequent
      # steps after a failed one unless they opt into always()/
      # continue-on-error). So a failed upload leaves today's marker
      # unset, and the NEXT cron-job.org call in the window correctly
      # retries today's post instead of skipping it -- same retry-
      # safety as the alert Shorts' per-Short "mark done" steps.
      - name: Mark today done
        if: steps.gate.outputs.target == 'post'
        run: python scripts/ci/drive_state_sync.py mark-done purana_short

      # Pushes state (including the advanced rotation index and any
      # refreshed YouTube token) back to Drive. Unconditional `always()`
      # here so a refreshed token is never lost even if the pipeline
      # step above failed -- if today wasn't marked done (previous
      # step skipped), this push still carries whatever state exists
      # locally, which is safe either way.
      - name: Push state to Drive
        if: always() && steps.gate.outputs.target == 'post'
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py push

      - name: Upload run output as artifact (debugging)
        if: steps.gate.outputs.target == 'post'
        uses: actions/upload-artifact@v4
        with:
          name: purana-short-run-${{ github.run_id }}
          path: |
            data/logs/
            data/generated/
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/ci/notify_failure.py "Channel A | Purana Story Short (5 PM IST)"
