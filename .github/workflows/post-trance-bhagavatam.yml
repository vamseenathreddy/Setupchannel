name: Post Trance Bhagavatam Short

# Part of the 7-channel expansion (channels/, added 2026-10) -- Pattern A (static content
# bank, Hindi-only, Krishna/Radha bhajan-kirtan focus -- distinct from Divine Mantra Sangam's
# Om/Shiva mantra focus, see channels/trance_beats/channel_config.py). This channel already has
# real traction (24 subs, one video at 3K views per the owner) so posting reliability matters
# more here than for the brand-new channels. Same cron-job.org + daily-reschedule pattern as
# post-ramana-short.yml: channels.trance_beats.scripts.ci.gate_bhagavatam.py decides on each call whether
# THIS is the day's randomly-chosen post time (19:00-19:40 IST), and
# scripts/ci/cronjob_reschedule.py re-points cron-job.org to fire only at [target, 20:55
# safety-net] each day -- see that script's "trance_beats" SERIES entry.
#
# Posts UNLISTED by default (--public is NOT passed) until reviewed.
#
# *** DRIVE SETUP REQUIRED BEFORE THE FIRST GATED RUN *** -- create two files by hand in the
# same Drive folder as every other marker file -- an empty one named exactly
# "youtube_token_trance_beats.json", and one named exactly "trance_beats_state.json"
# containing just `{}`.
#
# *** ONE-TIME LOCAL STEPS BEFORE THE FIRST REAL RUN ***
# 1. python -m mahanavi.scripts.youtube_shorts_auth_setup --token-file data/youtube_token_trance_beats.json
#    (choose the EXISTING Devotional Trance Beats channel/account at the Google consent screen
#    -- this is the channel with real subscribers, not a new one)
# 2. python scripts/ci/drive_state_sync.py push
# 3. Create a cron-job.org job whose URL is
#    https://api.github.com/repos/OWNER/REPO/actions/workflows/post-trance-bhagavatam.yml/dispatches
#    (method POST, body {"ref":"main"}) -- any starting schedule is fine.
on:
  workflow_dispatch:
    inputs:
      public:
        description: "Upload as public. Uncheck for an unlisted test/review run."
        required: false
        type: boolean
        default: false
      bypass_gate:
        description: >-
          Post immediately, ignoring the 19:00-19:40 IST window and today's already-posted
          marker. For manual testing/review runs only.
        required: false
        type: boolean
        default: false
      force_row:
        description: "Force a specific content row id instead of the normal rotation. Leave blank for normal behavior."
        required: false
        default: ''
  schedule:
    - cron: "30 1 * * *"
    - cron: "0 2 * * *"
    - cron: "30 2 * * *"
    - cron: "0 3 * * *"
    - cron: "25 3 * * *"
    # several pings inside the window: the gate posts on the first one past the day's target minute,
    # so a delayed or dropped GitHub cron cannot make a day miss.

concurrency:
  group: post-trance-bhagavatam
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  post-trance-bhagavatam:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install minimal deps for state sync + gate
        run: pip install google-auth google-api-python-client

      - name: Restore persistent state from Google Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py pull

      - name: Decide whether this call should post today
        id: gate
        env:
          STATE_FILE: data/trance_bhagavatam_state.json
          FORCE_POST: ${{ inputs.bypass_gate && 'true' || 'false' }}
        run: python -m channels.trance_beats.scripts.ci.gate_bhagavatam

      - name: Install ffmpeg + text shaping libs
        if: steps.gate.outputs.post == 'true'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ffmpeg libraqm0 libfribidi0 libharfbuzz0b

      - name: Install full Python dependencies
        if: steps.gate.outputs.post == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Devotional Trance Beats pipeline
        id: pipeline
        if: steps.gate.outputs.post == 'true'
        env:
          STATE_FILE: data/trance_bhagavatam_state.json
          MAHANAVI_TRANCE_BEATS_YOUTUBE_TOKEN_FILE: ./data/youtube_token_trance_beats.json
          MAHANAVI_TRANCE_BHAGAVATAM_PLAYLIST_ID: ${{ secrets.MAHANAVI_TRANCE_BHAGAVATAM_PLAYLIST_ID }}
          MAHANAVI_TRANCE_BEATS_BLOGGER_BLOG_ID: ${{ secrets.MAHANAVI_TRANCE_BEATS_BLOGGER_BLOG_ID }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: |
          ARGS=""
          if [ "${{ inputs.public }}" = "true" ]; then
            ARGS="$ARGS --public"
          fi
          if [ -n "${{ inputs.force_row }}" ]; then
            ARGS="$ARGS --row ${{ inputs.force_row }}"
          fi
          python3 -m channels.trance_beats.scripts.post_bhagavatam $ARGS

      - name: Push state to Drive (includes advanced rotation + any refreshed token)
        if: always() && steps.gate.outputs.post == 'true'
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py push

      - name: Upload run output as artifact (debugging)
        if: steps.gate.outputs.post == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: devotional-trance-beats-run-${{ github.run_id }}
          path: |
            out/short.mp4
            out/meta.json
            out/captions_*.srt
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/ci/notify_failure.py "Post Trance Bhagavatam Short"
