name: Post Rashi Mantra Short (Manual)

# Manual-only -- no schedule: trigger, by explicit request: this series
# is evergreen (a rashi's ruling-planet mantra), not a date-specific
# Panchang alert, and the user wants to run it themselves at a chosen
# time (researched evening window 7:30-8:30 PM IST) rather than have it
# auto-fire. One run posts ONE rashi -- the next one in the 12-rashi
# rotation (data/last_rashi_index.txt, synced via Drive, same pattern as
# the alert Shorts' "posted today" markers) -- not all 12 at once.
on:
  workflow_dispatch:
    inputs:
      public:
        description: >-
          Upload as public. Leave unchecked to upload unlisted first and
          review the result in YouTube Studio before making it public.
        required: false
        type: boolean
        default: false
      force_rashi:
        description: >-
          Force a specific rashi instead of the next one in rotation --
          index 0-11 (0=Mesha), or a name like "Simha". Leave blank for
          normal rotation behavior. A forced run does NOT advance the
          stored rotation state (it's a one-off re-post/test).
        required: false
        default: ''

permissions:
  contents: read

jobs:
  post-rashi-mantra:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install minimal deps for state sync
        run: pip install google-auth google-api-python-client

      - name: Restore persistent state from Google Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py pull

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install full Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Rashi Mantra Short pipeline
        env:
          MAHANAVI_IMAGES_ROOT: ./Images
          MAHANAVI_ASSETS_DIR: ./assets
          MAHANAVI_OUTPUT_DIR: ./data/generated
          MAHANAVI_DATABASE_PATH: ./data/mahanavi.db
          MAHANAVI_LOG_DIR: ./data/logs
          MAHANAVI_TIMEZONE: Asia/Kolkata
          MAHANAVI_YOUTUBE_TOKEN_FILE: ./data/youtube_token.json
          MAHANAVI_PLAYLIST_ID_RASHI: ${{ secrets.MAHANAVI_PLAYLIST_ID_RASHI }}
        run: |
          ARGS=""
          if [ "${{ inputs.public }}" = "true" ]; then
            ARGS="$ARGS --public"
          fi
          if [ -n "${{ inputs.force_rashi }}" ]; then
            ARGS="$ARGS --rashi ${{ inputs.force_rashi }}"
          fi
          python3 -m mahanavi.scripts.post_rashi_mantra_short $ARGS

      # Pushes the advanced rotation index (data/last_rashi_index.txt)
      # back to Drive so the NEXT run knows to post the next rashi, plus
      # any refreshed YouTube token. Runs even on failure so a token
      # refresh is never lost, but a failed run's rotation index is
      # simply whatever the script left locally (unchanged, since
      # _write_rotation_index only runs after a successful upload).
      - name: Push state to Drive
        if: always()
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py push

      - name: Upload run output as artifact (debugging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rashi-mantra-run-${{ github.run_id }}
          path: |
            data/logs/
            data/generated/
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/ci/notify_failure.py "Post Rashi Mantra Short"
