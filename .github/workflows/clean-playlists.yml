name: Tools | Clean Playlists

# Removes playlist ENTRIES whose video is deleted/unavailable (and repeated entries) on every channel.
# Never deletes a video. apply=false is a dry run that only prints what it would remove.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "true = remove the dead entries, false = dry run"
        required: false
        default: "true"

permissions:
  contents: read

jobs:
  list-recent-uploads:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install minimal deps for state sync
        run: pip install google-auth google-api-python-client

      - name: Restore persistent state from Google Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py pull

      - name: Install full Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Clean playlists
        run: |
          set -o pipefail
          python scripts/ci/clean_playlists.py ${{ inputs.apply == 'false' && ' ' || '--apply' }} 2>&1 | tee data/playlist_clean_log.txt

      - name: Push log to Drive
        if: always()
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/push_drive_asset.py data/playlist_clean_log.txt recent_uploads_log.txt
