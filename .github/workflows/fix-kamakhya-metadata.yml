name: Fix Kamakhya Metadata (One-Off Utility)

# Read-only: prints title, description (lyrics), tags and duration of the
# channel's own videos matching a title substring. Output goes to the
# Drive log file like the other utilities.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run (print only) or apply"
        required: true
        default: "dry-run"
      token_file:
        description: "Saved token to use"
        required: false
        default: "youtube_token.json"

permissions:
  contents: read

jobs:
  fix-kamakhya-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install minimal deps for state sync
        run: pip install google-auth google-api-python-client

      - name: Restore persistent state from Google Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py pull

      - name: Install full Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Fix Kamakhya metadata
        env:
          MAHANAVI_YOUTUBE_TOKEN_FILE: ./data/${{ inputs.token_file || 'youtube_token.json' }}
        run: |
          set -o pipefail
          python3 scripts/ci/fix_kamakhya_metadata.py "${{ inputs.mode }}" 2>&1 | tee data/recent_uploads_log.txt

      # Same Drive hand-off pattern as every other CI step here -- this
      # environment can't fetch GitHub Actions job logs directly, so
      # push the output to Drive (file pre-created by hand since
      # service-account create() has no storage quota) and read it back
      # from there.
      - name: Push output log to Drive
        if: always()
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/push_drive_asset.py data/recent_uploads_log.txt recent_uploads_log.txt
