name: Channel A | Stotra Video (weekly)

# Weekly long-form stotra/mantra video (landscape, Telugu lyric pages
# over a deity background, custom thumbnail). Content spec:
# src/ytcore/content/stotras/<slug>.json. The audio and background
# image named in the spec must be in the shared Drive folder.
# Defaults to PRIVATE so the owner reviews before it goes live.
on:
  workflow_dispatch:
    inputs:
      slug:
        description: "Stotra slug (file name in content/stotras, e.g. kamakhya)"
        required: true
        default: kamakhya
      privacy:
        description: "private, unlisted or public"
        required: false
        default: private
      render_only:
        description: "true = render only, do not upload"
        required: false
        default: 'false'

permissions:
  contents: read

env:
  CHANNEL_BRANDS: ${{ secrets.CHANNEL_BRANDS }}

jobs:
  post-stotra-video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install minimal deps for state sync
        run: pip install google-auth google-api-python-client
      - name: Restore persistent state from Google Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py pull
      - name: Fetch audio and background from Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          SLUG: ${{ inputs.slug }}
        run: |
          python scripts/ci/fetch_drive_asset.py "stotra_${SLUG}.mp3"
          python scripts/ci/fetch_drive_asset.py "stotra_${SLUG}.jpg" || echo "no background image, fallback will be used"
      - name: Install ffmpeg
        run: bash scripts/ci/apt_install.sh ffmpeg
      - name: Install full Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Render and upload
        env:
          MAHANAVI_YOUTUBE_TOKEN_FILE: ./data/youtube_token.json
          MAHANAVI_PLAYLIST_ID_STOTRAS: ${{ secrets.MAHANAVI_PLAYLIST_ID_STOTRAS }}
          SLUG: ${{ inputs.slug }}
          PRIVACY: ${{ inputs.privacy }}
          RENDER_ONLY: ${{ inputs.render_only }}
        run: |
          set -o pipefail
          EXTRA=""
          if [ "$RENDER_ONLY" = "true" ]; then EXTRA="--render-only"; fi
          python3 -m ytcore.scripts.post_stotra_video "$SLUG" --privacy "$PRIVACY" $EXTRA 2>&1 | tee data/stotra_error.log
      - name: Upload render as run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stotra-render
          path: |
            data/generated/stotra_*.mp4
            data/generated/stotra_*_thumb.jpg
          if-no-files-found: ignore
          retention-days: 7
