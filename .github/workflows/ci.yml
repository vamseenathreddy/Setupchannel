name: System | CI tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy

      - name: Create placeholder Images/ folders
        # Settings validation requires images_root to exist. CI has no real
        # devotional photos, so create empty weekday folders — tests that
        # need actual image files create their own in tmp_path fixtures.
        run: |
          for d in Monday_Shiva Tuesday_Hanuman Wednesday_Ganesha Thursday_Sai Friday_Lakshmi Saturday_Venkateswara Sunday_Surya; do
            mkdir -p "Images/$d"
          done

      - name: Run tests with coverage
        # pyproject.toml's testpaths = ["tests"] already excludes
        # ramana/tests/ (Ramana Maharshi TV's own suite needs extra deps
        # this job doesn't install -- fonttools, ffmpeg -- and manipulates
        # sys.path for its own standalone "src" package). --ignore=ramana
        # here is just defensive in case this command is ever run without
        # that config (e.g. a bare `pytest` invocation elsewhere).
        run: |
          PYTHONPATH=src pytest --cov=mahanavi --cov-report=term-missing --cov-report=xml --ignore=ramana

      - name: Type check with mypy
        run: |
          PYTHONPATH=src mypy src/mahanavi --ignore-missing-imports

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

