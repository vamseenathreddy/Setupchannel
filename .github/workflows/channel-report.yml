name: System | Channel performance report

# Read-only. Weekly (Sunday 23:30 IST) and on demand: one report per channel (views, likes and comments
# by series and by publish hour, top and bottom videos, drafts waiting). Output goes to Drive log files
# (pre-created by hand) so the numbers can be read back and the next content batches aligned to them.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * 0"

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: mahanavi
            token_file: youtube_token.json
          - name: ramana
            token_file: youtube_token_ramana.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install minimal deps for state sync
        run: pip install google-auth google-api-python-client

      - name: Restore persistent state from Google Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py pull

      - name: Install full Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Build report
        env:
          MAHANAVI_YOUTUBE_TOKEN_FILE: ./data/${{ matrix.token_file }}
        run: |
          set -o pipefail
          python3 scripts/ci/channel_report.py 120 2>&1 | tee data/channel_report_${{ matrix.name }}.txt

      - name: Push report to Drive
        if: always()
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/push_drive_asset.py data/channel_report_${{ matrix.name }}.txt channel_report_${{ matrix.name }}.txt
