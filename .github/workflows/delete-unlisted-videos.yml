name: Delete Unlisted Test Videos (One-Off Utility)

# Finds every non-public (private/unlisted) video on the channel --
# draft/test artifacts left over from manual review dispatches -- and,
# only when "confirm" is checked, permanently deletes them. Defaults to
# a dry run (lists candidates, deletes nothing) so the list can always
# be reviewed first. Added 2026-10-03 per explicit request.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Actually delete the listed videos (unchecked = dry run, lists only)"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  delete-unlisted-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install minimal deps for state sync
        run: pip install google-auth google-api-python-client

      - name: Restore persistent state from Google Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py pull

      - name: Install full Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: List (and optionally delete) unlisted/private videos
        env:
          MAHANAVI_YOUTUBE_TOKEN_FILE: ./data/youtube_token.json
        run: |
          if [ "${{ inputs.confirm }}" = "true" ]; then
            python3 scripts/ci/delete_unlisted_test_videos.py --confirm
          else
            python3 scripts/ci/delete_unlisted_test_videos.py
          fi
