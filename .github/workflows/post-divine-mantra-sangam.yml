name: Post Divine Mantra Sangam Short

# Part of the 7-channel expansion (channels/, added 2026-10) -- Pattern A (static content
# bank, Hindi-only, Om/Shiva-style mantra focus -- see channels/mantra_sangam/channel_config.py
# for why this and Devotional Trance Beats were given different content themes despite the
# owner describing both the same way). Same cron-job.org + daily-reschedule pattern as
# post-ramana-short.yml: channels/mantra_sangam/scripts/ci/gate.py decides on each call whether
# THIS is the day's randomly-chosen post time (09:00-09:40 IST), and
# scripts/ci/cronjob_reschedule.py re-points cron-job.org to fire only at [target, 10:55
# safety-net] each day -- see that script's "mantra_sangam" SERIES entry.
#
# Posts UNLISTED by default (--public is NOT passed) until reviewed.
#
# *** DRIVE SETUP REQUIRED BEFORE THE FIRST GATED RUN *** -- create two files by hand in the
# same Drive folder as every other marker file -- an empty one named exactly
# "youtube_token_mantra_sangam.json", and one named exactly "mantra_sangam_state.json"
# containing just `{}`.
#
# *** ONE-TIME LOCAL STEPS BEFORE THE FIRST REAL RUN ***
# 1. python -m mahanavi.scripts.youtube_shorts_auth_setup --token-file data/youtube_token_mantra_sangam.json
#    (choose the Divine Mantra Sangam channel/account at the Google consent screen)
# 2. python scripts/ci/drive_state_sync.py push
# 3. Create a cron-job.org job whose URL is
#    https://api.github.com/repos/OWNER/REPO/actions/workflows/post-divine-mantra-sangam.yml/dispatches
#    (method POST, body {"ref":"main"}) -- any starting schedule is fine.
on:
  workflow_dispatch:
    inputs:
      public:
        description: "Upload as public. Uncheck for an unlisted test/review run."
        required: false
        type: boolean
        default: false
      bypass_gate:
        description: >-
          Post immediately, ignoring the 09:00-09:40 IST window and today's already-posted
          marker. For manual testing/review runs only.
        required: false
        type: boolean
        default: false
      force_row:
        description: "Force a specific content row id instead of the normal rotation. Leave blank for normal behavior."
        required: false
        default: ''
  schedule:
    - cron: "30 3 * * *"  # 09:00 IST
    - cron: "25 5 * * *"  # 10:55 IST, late safety net

concurrency:
  group: post-divine-mantra-sangam
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  post-divine-mantra-sangam:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install minimal deps for state sync + gate
        run: pip install google-auth google-api-python-client

      - name: Restore persistent state from Google Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py pull

      - name: Decide whether this call should post today
        id: gate
        env:
          STATE_FILE: data/mantra_sangam_state.json
          FORCE_POST: ${{ inputs.bypass_gate && 'true' || 'false' }}
        run: python -m channels.mantra_sangam.scripts.ci.gate

      - name: Install ffmpeg + text shaping libs
        if: steps.gate.outputs.post == 'true'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends ffmpeg libraqm0 libfribidi0 libharfbuzz0b

      - name: Install full Python dependencies
        if: steps.gate.outputs.post == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Divine Mantra Sangam pipeline
        id: pipeline
        if: steps.gate.outputs.post == 'true'
        env:
          STATE_FILE: data/mantra_sangam_state.json
          MAHANAVI_MANTRA_SANGAM_YOUTUBE_TOKEN_FILE: ./data/youtube_token_mantra_sangam.json
          MAHANAVI_MANTRA_SANGAM_PLAYLIST_ID: ${{ secrets.MAHANAVI_MANTRA_SANGAM_PLAYLIST_ID }}
          MAHANAVI_MANTRA_SANGAM_BLOGGER_BLOG_ID: ${{ secrets.MAHANAVI_MANTRA_SANGAM_BLOGGER_BLOG_ID }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: |
          ARGS=""
          if [ "${{ inputs.public }}" = "true" ]; then
            ARGS="$ARGS --public"
          fi
          if [ -n "${{ inputs.force_row }}" ]; then
            ARGS="$ARGS --row ${{ inputs.force_row }}"
          fi
          python3 -m channels.mantra_sangam.scripts.post $ARGS

      - name: Push state to Drive (includes advanced rotation + any refreshed token)
        if: always() && steps.gate.outputs.post == 'true'
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py push

      - name: Upload run output as artifact (debugging)
        if: steps.gate.outputs.post == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: divine-mantra-sangam-run-${{ github.run_id }}
          path: |
            out/short.mp4
            out/meta.json
            out/captions_*.srt
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/ci/notify_failure.py "Post Divine Mantra Sangam Short"
