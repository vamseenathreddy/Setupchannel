name: Setup | Set Up YouTube Playlists

# Manual, one-off setup step (pipeline health review, 2026-10-03,
# suggestion #2: "no playlists"). Creates (or finds, if already made)
# the channel's 4 series playlists and prints their IDs in this run's
# log -- copy those into the GitHub repo secrets named in the log
# output. Safe to re-run any time (idempotent by playlist title, see
# youtube_playlists_setup.py's docstring).
#
# Runs in CI (not locally) because this needs the REAL saved YouTube
# token, which only exists here after being restored from Drive --
# same reason every other posting workflow works this way.
on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CHANNEL_BRANDS: ${{ secrets.CHANNEL_BRANDS }}

jobs:
  setup-playlists:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install minimal deps for state sync
        run: pip install google-auth google-api-python-client

      - name: Restore persistent state from Google Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py pull

      - name: Install full Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Create/find playlists and print their IDs
        env:
          MAHANAVI_YOUTUBE_TOKEN_FILE: ./data/youtube_token.json
        run: python3 -m ytcore.scripts.youtube_playlists_setup

      - name: Push state to Drive
        if: always()
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py push

      - name: Push printed playlist IDs to Drive (readable without a job-log fetch)
        if: always()
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/push_drive_asset.py data/playlist_ids.txt playlist_ids.txt
