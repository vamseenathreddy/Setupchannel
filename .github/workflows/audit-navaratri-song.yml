name: Tools | Audit Navaratri Song

# One-off read-only audit of the live "Swarnakavachadharini
# Kanakadurgamma" video -- privacy status, captions, playlist
# membership, made-for-kids flag -- to check what's still missing for
# maximum reach during Navaratri. Makes no changes.
on:
  workflow_dispatch: {}

permissions:
  contents: read

env:
  CHANNEL_BRANDS: ${{ secrets.CHANNEL_BRANDS }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install minimal deps for state sync
        run: pip install google-auth google-api-python-client

      - name: Restore persistent state from Google Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py pull

      - name: Install full Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Audit video
        env:
          MAHANAVI_YOUTUBE_TOKEN_FILE: ./data/youtube_token.json
        run: |
          set -o pipefail
          python scripts/ci/audit_navaratri_video.py 2>&1 | tee data/navaratri_audit_log.txt

      - name: Push result log to Drive
        if: always()
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/push_drive_asset.py data/navaratri_audit_log.txt navaratri_audit_log.txt
