name: System | YouTube token health check

# Daily, cheap, dependency-light health check (pipeline health review,
# 2026-10-03, suggestion #4) -- confirms the ONE shared YouTube token
# every posting series relies on still works, BEFORE the night's first
# posting window (Rahu Kalam starts at 12:00 AM IST). Sends a Telegram
# alert immediately on failure, both from inside the script itself
# (token_health_check.py, with clear re-auth instructions) and via the
# generic "Notify on failure" step below if the whole job errors out
# for some other reason.
on:
  schedule:
    # 11:00 PM IST = 17:30 UTC -- 30 minutes before the first posting
    # window opens, leaving a small window to notice and react.
    - cron: '30 17 * * 0'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  token-health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install minimal deps for state sync
        run: pip install google-auth google-api-python-client

      - name: Restore persistent state from Google Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py pull

      - name: Install full Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Check token health
        env:
          MAHANAVI_YOUTUBE_TOKEN_FILE: ./data/youtube_token.json
          MAHANAVI_TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          MAHANAVI_TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 -m mahanavi.scripts.token_health_check

      - name: Push state to Drive
        if: always()
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py push

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/ci/notify_failure.py "System | YouTube token health check"
