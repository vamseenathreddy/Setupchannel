name: Set Navaratri Song Thumbnail (One-Time)

# One-off manual step: sets the owner-supplied thumbnail graphic on
# the most recent "Swarnakavachadharini Kanakadurgamma" private draft.
# The thumbnail image itself is committed at
# assets/thumbnails/navaratri_durga_song_01.jpg (523KB, well under
# YouTube's 2MB thumbnail limit, pre-resized to 1280x720) rather than
# fetched from Drive, since routing an image that size through this
# session's chat context to upload it to Drive first wasn't practical.
#
# Requires the channel to be phone-verified for YouTube API custom
# thumbnails to work at all -- see set_navaratri_thumbnail.py's
# docstring. Output (including any failure) is pushed to Drive
# (navaratri_thumbnail_log.txt) since this environment can't fetch
# GitHub Actions job logs directly.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  set-thumbnail:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install minimal deps for state sync
        run: pip install google-auth google-api-python-client

      - name: Restore persistent state from Google Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py pull

      - name: Install full Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Set thumbnail
        env:
          MAHANAVI_YOUTUBE_TOKEN_FILE: ./data/youtube_token.json
        run: |
          set -o pipefail
          python scripts/ci/set_navaratri_thumbnail.py assets/thumbnails/navaratri_durga_song_01.jpg 2>&1 | tee data/navaratri_thumbnail_log.txt

      - name: Push result log to Drive
        if: always()
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/push_drive_asset.py data/navaratri_thumbnail_log.txt navaratri_thumbnail_log.txt
