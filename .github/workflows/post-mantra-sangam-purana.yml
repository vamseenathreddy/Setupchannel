name: Post Divine Mantra Sangam Purana Story Short

# Hindi Purana Story Short for Divine Mantra Sangam (content from channels/mantra_sangam/data).
# Posts UNLISTED by default until the channel owner approves. Needs data/youtube_token_mantra_sangam.json
# to act as the Divine Mantra Sangam channel (the pipeline refuses to post to any other channel).
on:
  workflow_dispatch:
    inputs:
      public:
        description: "Upload as public. Uncheck for an unlisted test/review run."
        required: false
        type: boolean
        default: false
      bypass_gate:
        description: >-
          Post immediately, ignoring the posting window and today's already-posted
          marker. For manual testing/review runs only.
        required: false
        type: boolean
        default: false
      force_row:
        description: "Force a specific content row id instead of the normal rotation. Leave blank for normal behavior."
        required: false
        default: ''
  # Same IST windows as Mahanavi Spirituals; several pings per window, the gate posts on the first one past the day's target minute.
  schedule:
  - cron: "40 11 * * *"
  - cron: "55 11 * * *"
  - cron: "10 12 * * *"
  - cron: "25 12 * * *"

concurrency:
  group: post-mantra-sangam-purana
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  post-mantra-sangam-purana:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install minimal deps for state sync + gate
        run: pip install google-auth google-api-python-client

      - name: Restore persistent state from Google Drive
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py pull

      - name: Decide whether this call should post today
        id: gate
        env:
          STATE_FILE: data/mantra_sangam_purana_state.json
          FORCE_POST: ${{ inputs.bypass_gate && 'true' || 'false' }}
        run: TIMING_KIND=purana python -m channels.mantra_sangam.scripts.ci.gate_timings

      - name: Install ffmpeg + text shaping libs
        if: steps.gate.outputs.post == 'true'
        run: |
          bash scripts/ci/apt_install.sh ffmpeg libraqm0 libfribidi0 libharfbuzz0b

      - name: Install full Python dependencies
        if: steps.gate.outputs.post == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run Divine Mantra Sangam timing pipeline
        id: pipeline
        if: steps.gate.outputs.post == 'true'
        env:
          STATE_FILE: data/mantra_sangam_purana_state.json
          MAHANAVI_MANTRA_SANGAM_YOUTUBE_TOKEN_FILE: ./data/youtube_token_mantra_sangam.json
          FORCE_POST: ${{ inputs.bypass_gate && 'true' || 'false' }}
          MAHANAVI_MANTRA_SANGAM_BLOGGER_BLOG_ID: ${{ secrets.MAHANAVI_MANTRA_SANGAM_BLOGGER_BLOG_ID }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
        run: |
          ARGS=""
          if [ "${{ inputs.public }}" = "true" ]; then
            ARGS="$ARGS --public"
          fi
          if [ -n "${{ inputs.force_row }}" ]; then
            ARGS="$ARGS --row ${{ inputs.force_row }}"
          fi
          SERIES_KIND=purana python3 -m channels.mantra_sangam.scripts.post_series $ARGS 2>&1 | tee run.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then echo "::error::$(tail -c 900 run.log | tr '\n' ' ')"; fi
          exit $rc

      - name: Push state to Drive (includes advanced rotation + any refreshed token)
        if: always() && steps.gate.outputs.post == 'true'
        env:
          GDRIVE_SA_KEY_JSON: ${{ secrets.GDRIVE_SA_KEY_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python scripts/ci/drive_state_sync.py push

      - name: Upload run output as artifact (debugging)
        if: steps.gate.outputs.post == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: mantra-sangam-purana-run-${{ github.run_id }}
          path: |
            out/short.mp4
            out/meta.json
            out/captions_*.srt
          if-no-files-found: ignore
          retention-days: 14

      - name: Notify on failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/ci/notify_failure.py "Post Divine Mantra Sangam Purana Story Short"
