[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "setupchannel"
version = "0.1.0"
description = "Automated daily Hindu devotional content pipeline for YouTube Community Posts."
requires-python = ">=3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-v --cov=ytcore --cov-report=term-missing"

[tool.mypy]
python_version = "3.13"
disallow_untyped_defs = true
warn_return_any = true
ignore_missing_imports = true

# fonts.py deliberately monkey-patches Pillow (ImageDraw.text/textbbox/textlength and
# per-font _mv_* attributes) so mixed Telugu/Latin text renders in one call; that is
# inherently dynamic and cannot be expressed in Pillow's type stubs.
[[tool.mypy.overrides]]
module = "ytcore.images.fonts"
disallow_untyped_defs = false
disable_error_code = ["attr-defined", "method-assign"]
